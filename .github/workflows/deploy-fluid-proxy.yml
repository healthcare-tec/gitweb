name: Deploy PubBid proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret ausente: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Verify public upstream
        run: |
          curl --fail --silent --show-error --max-time 30 'https://fluid-api.healthcare.tec.br/api/search?q=&refresh=0' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "results" in d and "coverage" in d'

      - name: Deploy existing Worker for PubBid
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fluid-proxy
          packageManager: npm
          wranglerVersion: "4"
          command: deploy
