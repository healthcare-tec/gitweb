name: Deploy Fluid proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate deployment secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLUID_API_TOKEN: ${{ secrets.FLUID_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          missing=0
          for name in \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_ACCOUNT_ID \
            FLUID_API_TOKEN \
            CF_ACCESS_CLIENT_ID \
            CF_ACCESS_CLIENT_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Secret ausente: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Deploy Worker and bind secrets
        uses: cloudflare/wrangler-action@v3
        env:
          FLUID_API_TOKEN: ${{ secrets.FLUID_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/fluid-proxy
          packageManager: npm
          wranglerVersion: "4"
          secrets: |
            FLUID_API_TOKEN
            CF_ACCESS_CLIENT_ID
            CF_ACCESS_CLIENT_SECRET
          command: deploy
